<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RDK Emergency Care — Every Second Counts, Every Life Matters</title>
  <meta name="description" content="Professional emergency care and first-aid training in Tanzania. Ambulance services, workplace safety training, and internationally aligned first-aid certificates.">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

  <div id="nav-mount"></div>

  <!-- Hero -->
  <section class="hero">
    <div class="container">
      <div class="hero-grid">
        <div>
          <span class="hero-badge" data-i18n="hero.badge"></span>
          <h1><span data-i18n="hero.title"></span></h1>
          <p class="lead" data-i18n="hero.sub"></p>
          <div class="btn-row">
            <a class="btn btn-accent btn-lg" href="quiz.html" data-i18n="hero.ctaQuiz"></a>
            <a class="btn btn-outline btn-lg" href="contact.html" data-i18n="hero.ctaContact"></a>
          </div>
          <svg class="ekg" viewBox="0 0 640 60" preserveAspectRatio="none" aria-hidden="true">
            <path d="M0 30 H90 L110 30 125 8 140 52 155 30 H250 L268 30 282 14 296 46 310 30 H420 L438 30 452 6 468 54 484 30 H640"/>
          </svg>
        </div>
        <aside class="hero-card" aria-label="RDK quick facts">
          <img class="hero-photo" src="assets/img/hero-firstaid.jpg" alt="RDK first-aid training session at an office" width="1200" height="800" loading="lazy">
          <div style="padding:1.3rem 1.4rem 1.1rem;">
            <p style="font-weight:700; font-size:1.05rem; margin-bottom:.35em;" data-i18n="hero.cardTitle"></p>
            <p class="hero-emph" data-i18n="hero.cardSub"></p>
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr 1fr; border-top:1px solid var(--line);">
            <div style="padding:.9rem .4rem; border-right:1px solid var(--line);">
              <strong style="display:block; color:var(--brand); font-size:1.15rem;">20+</strong>
              <span style="font-size:.74rem; color:var(--ink-soft);" data-i18n="hero.statCourses"></span>
            </div>
            <div style="padding:.9rem .4rem; border-right:1px solid var(--line);">
              <strong style="display:block; color:var(--brand); font-size:1.15rem;">24/7</strong>
              <span style="font-size:.74rem; color:var(--ink-soft);" data-i18n="hero.statResponse"></span>
            </div>
            <div style="padding:.9rem .4rem;">
              <strong style="display:block; color:var(--brand); font-size:1.15rem;">100%</strong>
              <span style="font-size:.74rem; color:var(--ink-soft);" data-i18n="hero.statCertified"></span>
            </div>
          </div>
        </aside>
      </div>
    </div>
  </section>

  <!-- Trust bar -->
  <section class="trust" aria-label="Credentials">
    <div class="container">
      <div class="trust-grid">
        <div class="trust-item">
          <span class="tick">✓</span>
          <strong data-i18n="trust.registered"></strong>
          <span data-i18n="trust.registeredNo"></span>
        </div>
        <div class="trust-item">
          <span class="tick">✓</span>
          <strong data-i18n="trust.licensed"></strong>
          <span data-i18n="trust.licensedNo"></span>
        </div>
        <div class="trust-item">
          <span class="tick">✓</span>
          <strong data-i18n="trust.always"></strong>
          <span data-i18n="trust.alwaysSub"></span>
        </div>
      </div>
    </div>
  </section>

  <!-- Services -->
  <section class="section" id="services">
    <div class="container">
      <div class="section-head center reveal">
        <span class="eyebrow" data-i18n="services.eyebrow"></span>
        <h2 data-i18n="services.title"></h2>
        <p class="lead" data-i18n="services.sub"></p>
      </div>
      <div class="svc-grid">
        <div class="card svc-card reveal">
          <span class="chip">🚑</span>
          <h3 data-i18n="svc.ambulance.t"></h3>
          <p class="muted mb-0" data-i18n="svc.ambulance.d"></p>
        </div>
        <div class="card svc-card reveal">
          <span class="chip green">⚡</span>
          <h3 data-i18n="svc.onsite.t"></h3>
          <p class="muted mb-0" data-i18n="svc.onsite.d"></p>
        </div>
        <div class="card svc-card reveal">
          <span class="chip">🎓</span>
          <h3 data-i18n="svc.training.t"></h3>
          <p class="muted mb-0" data-i18n="svc.training.d"></p>
        </div>
        <div class="card svc-card reveal">
          <span class="chip green">🚁</span>
          <h3 data-i18n="svc.evac.t"></h3>
          <p class="muted mb-0" data-i18n="svc.evac.d"></p>
        </div>
        <div class="card svc-card reveal">
          <span class="chip">🎪</span>
          <h3 data-i18n="svc.event.t"></h3>
          <p class="muted mb-0" data-i18n="svc.event.d"></p>
        </div>
        <div class="card svc-card reveal">
          <span class="chip green">🤝</span>
          <h3 data-i18n="svc.corporate.t"></h3>
          <p class="muted mb-0" data-i18n="svc.corporate.d"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- Quiz band -->
  <section class="quiz-band" aria-label="Training quiz">
    <div class="container quiz-band-inner">
      <div>
        <h2 data-i18n="quizband.title"></h2>
        <p data-i18n="quizband.sub"></p>
        <span class="note" data-i18n="quizband.note"></span>
      </div>
      <a class="btn btn-white btn-lg" href="quiz.html" data-i18n="quizband.cta"></a>
    </div>
  </section>

  <!-- Featured courses -->
  <section class="section">
    <div class="container">
      <div class="section-head center reveal">
        <span class="eyebrow" data-i18n="featured.eyebrow"></span>
        <h2 data-i18n="featured.title"></h2>
        <p class="lead" data-i18n="featured.sub"></p>
      </div>
      <div class="card-grid cols-3" id="featured-courses"></div>
      <p class="center mt-3">
        <a class="btn btn-outline" href="training.html" data-i18n="featured.all"></a>
      </p>
    </div>
  </section>

  <!-- Photo gallery -->
  <section class="section section-soft" id="gallery">
    <div class="container">
      <div class="section-head center reveal">
        <span class="eyebrow" data-i18n="gallery.eyebrow"></span>
        <h2 data-i18n="gallery.title"></h2>
        <p class="lead" data-i18n="gallery.sub"></p>
      </div>
      <div class="gallery-grid" id="gallery-grid"></div>
    </div>
  </section>

  <!-- Work abroad teaser -->
  <section class="section abroad-teaser" id="work-abroad">
    <div class="container abroad-inner">
      <div class="reveal">
        <div class="section-head" style="margin-bottom:.8rem;">
          <span class="eyebrow" data-i18n="abroad.eyebrow"></span>
          <h2 data-i18n="abroad.title"></h2>
          <p class="lead" data-i18n="abroad.sub"></p>
        </div>
        <div class="abroad-sectors" aria-label="High-paying sectors">
          <span>Healthcare &amp; Caregiving</span><span>Oil &amp; Gas</span><span>Maritime &amp; Cruise</span>
          <span>Hospitality</span><span>Construction</span><span>Security</span>
        </div>
        <div class="btn-row">
          <a class="btn btn-accent" href="work-abroad.html" data-i18n="abroad.cta"></a>
          <a class="btn btn-outline" href="quiz.html" data-i18n="abroad.cta2"></a>
        </div>
      </div>
      <aside class="abroad-card reveal">
        <span class="big">6+</span>
        <p data-i18n="abroad.sectorsCount"></p>
      </aside>
    </div>
  </section>

  <!-- Packages -->
  <section class="section" id="packages">
    <div class="container">
      <div class="section-head center reveal">
        <span class="eyebrow" data-i18n="packages.eyebrow"></span>
        <h2 data-i18n="packages.title"></h2>
        <p class="lead" data-i18n="packages.sub"></p>
      </div>
      <div class="card-grid cols-3" id="packages-grid" data-packages="sme,corporate,industrial-package"></div>
    </div>
  </section>

  <div id="footer-mount"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
