<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RDK Emergency Care — Every Second Counts, Every Life Matters</title>
  <meta name="description" content="Professional emergency care and first-aid training in Tanzania. Ambulance services, workplace safety training, and internationally aligned first-aid certificates.">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

  <div id="nav-mount"></div>

  <!-- Hero -->
  <section class="hero">
    <div class="container">
      <div class="hero-grid">
        <div>
          <span class="hero-badge" data-i18n="hero.badge"></span>
          <h1><span data-i18n="hero.title"></span></h1>
          <p class="lead" data-i18n="hero.sub"></p>
          <div class="btn-row">
            <a class="btn btn-accent btn-lg" href="quiz.html" data-i18n="hero.ctaQuiz"></a>
            <a class="btn btn-outline btn-lg" href="contact.html" data-i18n="hero.ctaContact"></a>
          </div>
          <svg class="ekg" viewBox="0 0 640 60" preserveAspectRatio="none" aria-hidden="true">
            <path d="M0 30 H90 L110 30 125 8 140 52 155 30 H250 L268 30 282 14 296 46 310 30 H420 L438 30 452 6 468 54 484 30 H640"/>
          </svg>
        </div>
        <aside class="hero-card" aria-label="RDK quick facts">
          <div style="padding:2rem 1.6rem; text-align:center;">
            <img src="assets/img/rdk-logo.png" alt="RDK Emergency Care logo" width="185" height="133" style="margin:0 auto 1rem;">
            <p style="font-weight:700; font-size:1.05rem; margin-bottom:.2em;" data-i18n="hero.cardTitle"></p>
            <p class="muted" style="font-size:.9rem; margin:0;" data-i18n="hero.cardSub"></p>
          </div>
          <div style="display:grid; grid-template-columns:1fr 1fr 1fr; border-top:1px solid var(--line);">
            <div style="padding:.9rem .4rem; border-right:1px solid var(--line);">
              <strong style="display:block; color:var(--brand); font-size:1.15rem;">20+</strong>
              <span style="font-size:.74rem; color:var(--ink-soft);" data-i18n="hero.statCourses"></span>
            </div>
            <div style="padding:.9rem .4rem; border-right:1px solid var(--line);">
              <strong style="display:block; color:var(--brand); font-size:1.15rem;">24/7</strong>
              <span style="font-size:.74rem; color:var(--ink-soft);" data-i18n="hero.statResponse"></span>
            </div>
            <div style="padding:.9rem .4rem;">
              <strong style="display:block; color:var(--brand); font-size:1.15rem;">100%</strong>
              <span style="font-size:.74rem; color:var(--ink-soft);" data-i18n="hero.statCertified"></span>
            </div>
          </div>
        </aside>
      </div>
    </div>
  </section>

  <!-- Trust bar -->
  <section class="trust" aria-label="Credentials">
    <div class="container">
      <div class="trust-grid">
        <div class="trust-item">
          <span class="tick">✓</span>
          <strong data-i18n="trust.registered"></strong>
          <span data-i18n="trust.registeredNo"></span>
        </div>
        <div class="trust-item">
          <span class="tick">✓</span>
          <strong data-i18n="trust.licensed"></strong>
          <span data-i18n="trust.licensedNo"></span>
        </div>
        <div class="trust-item">
          <span class="tick">✓</span>
          <strong data-i18n="trust.always"></strong>
          <span data-i18n="trust.alwaysSub"></span>
        </div>
      </div>
    </div>
  </section>

  <div id="footer-mount"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
