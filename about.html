<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta property="og:description" content="RDK Emergency Care Company Limited: a fully registered Tanzanian emergency medical services and training company based in Kigamboni, Dar es Salaam.">
  <meta property="og:image" content="https://www.rdk.co.tz/assets/img/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="About Us — RDK Emergency Care">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

  <div id="nav-mount"></div>

  <section class="page-hero">
    <div class="container">
      <span class="eyebrow" data-i18n="about.eyebrow"></span>
      <h1 data-i18n="about.title"></h1>
      <p class="lead" data-i18n="about.story"></p>
    </div>
  </section>

  <!-- Mission / Vision / Values -->
  <section class="section">
    <div class="container">
      <div class="card-grid cols-3">
        <div class="card">
          <span class="chip">🎯</span>
          <h3 data-i18n="about.missionTitle"></h3>
          <p class="muted mb-0" data-i18n="about.mission"></p>
        </div>
        <div class="card">
          <span class="chip green">🔭</span>
          <h3 data-i18n="about.visionTitle"></h3>
          <p class="muted mb-0" data-i18n="about.vision"></p>
        </div>
        <div class="card">
          <span class="chip">💎</span>
          <h3 data-i18n="about.valuesTitle"></h3>
          <ul class="why-list">
            <li data-i18n="about.val.compassion"></li>
            <li data-i18n="about.val.integrity"></li>
            <li data-i18n="about.val.excellence"></li>
            <li data-i18n="about.val.innovation"></li>
            <li data-i18n="about.val.community"></li>
          </ul>
        </div>
      </div>
    </div>
  </section>

  <!-- Leadership -->
  <section class="section section-soft">
    <div class="container">
      <div class="section-head center">
        <h2 data-i18n="about.teamTitle"></h2>
        <p class="lead" data-i18n="about.teamSub"></p>
      </div>
      <div class="card-grid cols-3">
        <div class="card leader-card">
          <img src="assets/img/leader-paul.jpg" alt="Paul R. O Sewe" loading="lazy">
          <h3 class="mt-2 mb-0">Paul R. O Sewe</h3>
          <p class="muted mb-0" data-i18n="about.leader.paul"></p>
        </div>
        <div class="card leader-card">
          <img src="assets/img/leader-reinfrida.jpg" alt="Dr. Reinfrida Charles" loading="lazy">
          <h3 class="mt-2 mb-0">Dr. Reinfrida Charles</h3>
          <p class="muted mb-0" data-i18n="about.leader.reinfrida"></p>
        </div>
        <div class="card leader-card">
          <img src="assets/img/leader-kelvin.jpg" alt="Kelvin L. Mziray" loading="lazy">
          <h3 class="mt-2 mb-0">Kelvin L. Mziray</h3>
          <p class="muted mb-0" data-i18n="about.leader.kelvin"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- Legal & clients -->
  <section class="section">
    <div class="container">
      <div class="card-grid">
        <div class="card">
          <span class="chip">🛡️</span>
          <h3 data-i18n="about.legalTitle"></h3>
          <ul class="why-list">
            <li data-i18n="footer.incorp"></li>
            <li data-i18n="footer.license"></li>
            <li data-i18n="footer.tin"></li>
          </ul>
        </div>
        <div class="card">
          <span class="chip green">🤝</span>
          <h3 data-i18n="about.clientsTitle"></h3>
          <p class="muted mb-0" data-i18n="about.clientsSub"></p>
        </div>
      </div>
    </div>
  </section>

  <div id="footer-mount"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/cookies.js"></script>
</body>
</html>
