<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Abroad — First Aid That Pays | RDK Emergency Care</title>
  <meta name="description" content="Certified first-aid training is the life skill that opens doors to the highest-paying sectors abroad: healthcare, oil & gas, maritime, hospitality, construction, childcare and security.">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

  <div id="nav-mount"></div>

  <section class="page-hero abroad-teaser" style="border-bottom:1px solid #D5EAD7;">
    <div class="container">
      <span class="eyebrow" data-i18n="abroadPage.eyebrow"></span>
      <h1 data-i18n="abroadPage.title"></h1>
      <p class="lead" data-i18n="abroadPage.sub"></p>
    </div>
  </section>

  <!-- How it helps -->
  <section class="section">
    <div class="container">
      <div class="section-head center">
        <h2 data-i18n="abroadPage.how"></h2>
      </div>
      <div class="card-grid cols-3">
        <div class="card"><span class="chip">📄</span><p class="mb-0" data-i18n="abroadPage.how1"></p></div>
        <div class="card"><span class="chip green">✔</span><p class="mb-0" data-i18n="abroadPage.how2"></p></div>
        <div class="card"><span class="chip">⚖️</span><p class="mb-0" data-i18n="abroadPage.how3"></p></div>
      </div>
    </div>
  </section>

  <!-- Sectors -->
  <section class="section section-soft">
    <div class="container">
      <div class="section-head center">
        <h2 data-i18n="abroadPage.sectors"></h2>
      </div>
      <div class="card-grid cols-3" id="sectors-grid"></div>
    </div>
  </section>

  <!-- Why RDK -->
  <section class="section">
    <div class="container">
      <div class="abroad-inner">
        <div>
          <div class="section-head" style="margin-bottom:1rem;">
            <h2 data-i18n="abroadPage.whyTitle"></h2>
          </div>
          <ul class="why-list" style="max-width:34rem;">
            <li data-i18n="abroadPage.why1"></li>
            <li data-i18n="abroadPage.why2"></li>
            <li data-i18n="abroadPage.why3"></li>
            <li data-i18n="abroadPage.why4"></li>
          </ul>
        </div>
        <aside class="abroad-card">
          <span class="big">🛂</span>
          <p data-i18n="abroadPage.ctaTitle" style="font-weight:700;color:var(--ink);"></p>
        </aside>
      </div>
    </div>
  </section>

  <!-- CTA -->
  <section class="quiz-band">
    <div class="container quiz-band-inner">
      <div>
        <h2 data-i18n="abroadPage.ctaTitle"></h2>
        <p data-i18n="abroadPage.ctaSub"></p>
      </div>
      <div class="btn-row">
        <a class="btn btn-white btn-lg" href="quiz.html" data-i18n="quizband.cta"></a>
        <a class="btn btn-outline btn-lg" style="border-color:#fff;color:#fff;" href="contact.html" data-i18n="hero.ctaContact"></a>
      </div>
    </div>
  </section>

  <div id="footer-mount"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
