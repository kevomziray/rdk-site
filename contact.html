<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — RDK Emergency Care</title>
  <meta name="description" content="Book a first-aid course, request a corporate quote, or ask RDK Emergency Care anything. Based in Kigamboni, Dar es Salaam.">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="canonical" href="https://www.rdk.co.tz/contact.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="RDK Emergency Care">
  <meta property="og:url" content="https://www.rdk.co.tz/contact.html">
  <meta property="og:title" content="Contact — RDK Emergency Care">
  <meta property="og:description" content="Book a first-aid course, request a corporate quote, or ask RDK Emergency Care anything. Based in Kigamboni, Dar es Salaam.">
  <meta property="og:image" content="https://www.rdk.co.tz/assets/img/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Contact — RDK Emergency Care">
  <meta name="twitter:description" content="Book a first-aid course, request a corporate quote, or ask RDK Emergency Care anything. Based in Kigamboni, Dar es Salaam.">
  <meta name="twitter:image" content="https://www.rdk.co.tz/assets/img/og-image.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

  <div id="nav-mount"></div>

  <section class="page-hero">
    <div class="container">
      <span class="eyebrow" data-i18n="contact.eyebrow"></span>
      <h1 data-i18n="contact.title"></h1>
      <p class="lead" data-i18n="contact.sub"></p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="contact-grid">
        <!-- Info card -->
        <aside class="card" id="contact-info">
          <h3 data-i18n="contact.infoTitle"></h3>
          <div class="contact-line">
            <span class="chip">✉️</span>
            <div>
              <strong data-i18n="contact.emailLabel"></strong>
              <p class="muted mb-0"><a id="contact-email-link" href="mailto:info@rdk.co.tz">info@rdk.co.tz</a></p>
            </div>
          </div>
          <div class="contact-line">
            <span class="chip green">📍</span>
            <div>
              <strong data-i18n="contact.officeLabel"></strong>
              <p class="muted mb-0">Kigamboni<br>P.O. Box Kigamboni<br>Dar es Salaam, Tanzania</p>
            </div>
          </div>
          <div class="contact-line">
            <span class="chip">🕒</span>
            <div>
              <strong data-i18n="contact.hoursLabel"></strong>
              <p class="muted mb-0" data-i18n="contact.hoursValue"></p>
            </div>
          </div>
          <div id="contact-wa-slot"></div>
        </aside>

        <!-- Form card -->
        <div class="card">
          <h3 data-i18n="contact.formTitle"></h3>
          <form id="contact-form" novalidate>
            <div class="form-field">
              <label for="cf-name" data-i18n="contact.name"></label>
              <input type="text" id="cf-name" name="name" autocomplete="name" required>
            </div>
            <div class="form-field">
              <label for="cf-contact" data-i18n="contact.emailOrPhone"></label>
              <input type="text" id="cf-contact" name="contact" autocomplete="email" required>
            </div>
            <div class="form-field">
              <label for="cf-interest" data-i18n="contact.interest"></label>
              <select id="cf-interest" name="interest">
                <option value="course" data-i18n="contact.interest.course"></option>
                <option value="group" data-i18n="contact.interest.group"></option>
                <option value="service" data-i18n="contact.interest.service"></option>
                <option value="other" data-i18n="contact.interest.other"></option>
              </select>
            </div>
            <div class="form-field">
              <label for="cf-message" data-i18n="contact.message"></label>
              <textarea id="cf-message" name="message" rows="4" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-lg" data-i18n="contact.send"></button>
            <p class="muted mt-2 mb-0" style="font-size:.82rem;" data-i18n="contact.formNote"></p>
          </form>
        </div>
      </div>
    </div>
  </section>

  <div id="footer-mount"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/cookies.js"></script>
  <script>
    /* Contact form → mailto composer (no backend needed) */
    document.addEventListener("DOMContentLoaded", function () {
      var form = document.getElementById("contact-form");
      if (!form) return;
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var name = document.getElementById("cf-name").value.trim();
        var contact = document.getElementById("cf-contact").value.trim();
        var interest = document.getElementById("cf-interest");
        var interestText = interest.options[interest.selectedIndex].textContent;
        var message = document.getElementById("cf-message").value.trim();
        var subject = (window.t ? window.t("contact.subject") : "Website enquiry") + " — " + interestText;
        var body = message + "\n\n— " + name + "\n" + contact;
        var url = "mailto:" + window.RDK_CONFIG.email +
          "?subject=" + encodeURIComponent(subject) +
          "&body=" + encodeURIComponent(body);
        window.location.href = url;
      });
      /* WhatsApp button in the info card when a number is configured */
      var slot = document.getElementById("contact-wa-slot");
      if (slot && window.RDK_CONFIG.whatsapp) {
        slot.innerHTML = '<div class="contact-line"><span class="chip green" style="background:#E7F9EC;color:#1FB855;"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" style="vertical-align:-3px;" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg></span><div><strong>WhatsApp</strong>' +
          '<p class="muted mb-0"><a target="_blank" rel="noopener" href="' +
          window.rdkWhatsApp("Hello RDK Emergency Care!") + '">' +
          window.RDK_CONFIG.whatsappDisplay + "</a></p></div></div>";
      }
    });
  </script>
</body>
</html>
